name: icse_kids_app
description: Interactive ICSE Nursery, LKG & UKG Learning App with Animations and Voice Commands
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  rive: ^0.13.13
  lottie: ^3.1.2
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  flutter_animate: ^4.5.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
    - assets/audio/
